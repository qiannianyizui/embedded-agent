[agent]
model = "deepseek-chat"
max_iterations = 90
auto_memory = true
soul = "You are a helpful AI assistant running on a Linux/Android device."

[agent.compression]
enable = true
context_length = 0            # 0 = use default 128000
threshold_percent = 0.50
target_ratio = 0.20
protect_first_n = 3
protect_last_n = 20
max_summary_tokens = 0        # 0 = auto
abort_on_summary_failure = false
in_place = true

[log]
level = "debug"
persist = true
verbose = false
max_file_bytes = 10485760      # 10MB
max_total_bytes = 104857600    # 100MB

[trace]
persist = "rolling"
max_entries = 10000
tool_io = "redacted"
tool_io_truncate_bytes = 40960   # 40KB
llm_payload = "off"

[provider]
type = "openai_compatible"
base_url = "https://api.deepseek.com/v1"
api_key = ""
default_model = "deepseek-chat"
timeout = 60

[memory]
backend = "sqlite"
path = ""
enable_fts5 = true

[memory.files]
enable = true
dir = ""
memory_char_limit = 2200
user_char_limit = 1375

[onboarding]
profile_build = true
profile_build_offered = false

[memory.strategy]
type = "progressive"
working_turns = 6
short_term_max = 20
long_term_importance = 8
enable_fact_extraction = true
enable_auto_summarize = true

[security]
autonomy = "supervised"
workspace = ""
allowed_commands = [
    "ls", "cat", "head", "tail", "grep", "find", "wc",
    "pwd", "echo", "date", "whoami", "uname",
    "git", "curl", "wget"
]

[security.approval]
mode = "auto"
auto_approve_dangerous = false

[skills]
enable = true
dirs = []
disabled = []
template_vars = true
inline_shell = false
inline_shell_timeout = 10
plugin_mirrors = []

[web]
search_backend = "duckduckgo"
searxng_url = ""
exa_api_key = ""
parallel_api_key = ""
